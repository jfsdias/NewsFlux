name: One-shot Caddy-route code formatter

on:
  push:
    branches: [codex/newsflux-ai-settings-caddy-route-r1]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/newsflux-ai-settings-caddy-route-r1
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scoped route regression test only
        run: pnpm exec prettier --write scripts/pilot-e2e/test-caddy-route.mjs
      - name: Commit scoped formatting on the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/pilot-e2e/test-caddy-route.mjs
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "style(route): Prettier Caddy regression test"
            git push origin HEAD:refs/heads/codex/newsflux-ai-settings-caddy-route-r1
          fi

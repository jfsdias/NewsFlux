name: E2E

# Playwright scenarios against the production build and a synthetic Miniflux. Read-only: no
# secrets and no deployment permissions. Making this check required is a repository setting and is
# intentionally not done here; run `pnpm test:e2e:stability` locally before relying on it.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the e2e scenarios
        run: pnpm test:e2e

      - name: Upload synthetic E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/verified-e2e/
          if-no-files-found: ignore
          retention-days: 3

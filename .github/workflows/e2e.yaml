name: E2E

# Three-run Playwright stability against the production build and a synthetic Miniflux. Read-only:
# no secrets and no deployment permissions. Making this check required is a repository setting and
# is intentionally not done here.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact NewsFlux source SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright scenarios
    runs-on: ubuntu-24.04
    # Playwright 1.63.0 image, pinned to the verified OCI index digest.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Playwright browser image
        run: |
          node -e 'const p = require("@playwright/test/package.json"); if (p.version !== "1.63.0") process.exit(1); console.log(`PLAYWRIGHT_PACKAGE=${p.version}`)'
          browser="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          test -x "$browser"
          ldd "$browser" | tee /tmp/chromium-ldd.txt
          if grep -q 'not found' /tmp/chromium-ldd.txt; then
            echo "CHROMIUM_DEPENDENCIES=FAIL"
            exit 1
          fi
          echo "CHROMIUM_DEPENDENCIES=PASS"

      - name: Run the e2e scenarios
        run: pnpm test:e2e:stability

      - name: Upload synthetic E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/verified-e2e/
          if-no-files-found: ignore
          retention-days: 3

  ux_reach:
    name: UX-REACH-01 focused Chromium scenarios
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Playwright browser image
        run: |
          node -e 'const p = require("@playwright/test/package.json"); if (p.version !== "1.63.0") process.exit(1); console.log(`PLAYWRIGHT_PACKAGE=${p.version}`)'
          browser="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          test -x "$browser"
          ldd "$browser" | tee /tmp/chromium-ldd.txt
          if grep -q 'not found' /tmp/chromium-ldd.txt; then
            echo "CHROMIUM_DEPENDENCIES=FAIL"
            exit 1
          fi
          echo "CHROMIUM_DEPENDENCIES=PASS"

      - name: Build the production application
        run: pnpm build

      - name: Run focused UX-REACH scenarios
        run: pnpm exec playwright test --config=playwright.ux-reach-01.config.js

      - name: Upload UX-REACH diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-reach-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ux-reach-01/
          if-no-files-found: warn
          retention-days: 3

  article_intelligence_reader:
    name: Article Intelligence Reader Chromium scenarios
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Playwright browser image
        run: |
          node -e 'const p = require("@playwright/test/package.json"); if (p.version !== "1.63.0") process.exit(1); console.log(`PLAYWRIGHT_PACKAGE=${p.version}`)'
          browser="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          test -x "$browser"
          ldd "$browser" | tee /tmp/chromium-ldd.txt
          if grep -q 'not found' /tmp/chromium-ldd.txt; then
            echo "CHROMIUM_DEPENDENCIES=FAIL"
            exit 1
          fi
          echo "CHROMIUM_DEPENDENCIES=PASS"

      - name: Build Reader with AI disabled by default
        run: pnpm build

      - name: Run Article Intelligence Reader scenarios
        run: pnpm exec playwright test --config=playwright.article-intelligence.config.js

      - name: Build Reader with explicit AI enablement
        env:
          VITE_ARTICLE_INTELLIGENCE_ENABLED: "1"
        run: pnpm build

      - name: Run AI-enabled Reader scenarios
        env:
          VITE_ARTICLE_INTELLIGENCE_ENABLED: "1"
        run: pnpm exec playwright test --config=playwright.article-intelligence.config.js

      - name: Build Reader with recovery for cross-feature scenarios
        env:
          VITE_ARTICLE_INTELLIGENCE_ENABLED: "1"
          VITE_CONTENT_FALLBACK_READER_BASE_PATH: "/api/content-fallback"
        run: pnpm build

      - name: Run recovery and summary cross-feature scenarios
        env:
          VITE_ARTICLE_INTELLIGENCE_ENABLED: "1"
          VITE_CONTENT_FALLBACK_READER_BASE_PATH: "/api/content-fallback"
        run: pnpm exec playwright test --config=playwright.article-intelligence.config.js --grep AI_RECOVERY_CROSS

      - name: Upload Article Intelligence Reader diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: article-intelligence-reader-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/article-intelligence-reader/
          if-no-files-found: ignore
          retention-days: 3

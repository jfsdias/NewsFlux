name: R4.4 allowlist procedure

on:
  pull_request:
    paths:
      - "deploy/r44-admin-allowlist/**"
      - ".github/workflows/r44-operator-tool.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r44-operator-tool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  procedure-rehearsal:
    name: Allowlist procedure rehearsal (disposable, never a real host)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Static checks
        run: |
          set -euo pipefail
          d=deploy/r44-admin-allowlist
          for f in "$d"/*.sh "$d"/tests/*.sh; do bash -n "$f"; done
          python -I -c "import ast,sys; ast.parse(open(sys.argv[1]).read(), feature_version=(3, 9))" "$d/tests/fake_miniflux.py"
          # The procedure reuses the governed release tool from main; it must not edit production files itself.
          if grep -nE 'sed -i|>>? *"?\$?\{?(ENV|PRIV)|compose[^\n]* up' "$d/r44-allowlist.sh"; then exit 1; fi
      - name: Tool versions
        run: docker version --format 'docker={{.Server.Version}}' && docker compose version --short
      - name: Build the disposable Summary image from this source
        run: bash deploy/r44-admin-allowlist/tests/build-test-image.sh "$GITHUB_WORKSPACE"
      - name: Procedure rehearsal (identity, apply, rollback, interrupts, SIGKILL recovery, pins)
        run: sudo -E env "PATH=$PATH" bash deploy/r44-admin-allowlist/tests/procedure-test.sh

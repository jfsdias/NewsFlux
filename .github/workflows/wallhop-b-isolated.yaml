name: WallHop B isolated topology rehearsal
on:
  pull_request:
    paths:
      - "deploy/wallhop-b/**"
      - ".github/workflows/wallhop-b-isolated.yaml"
permissions:
  contents: read
jobs:
  synthetic-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run offline contract tests
        run: python3 -m unittest discover -s deploy/wallhop-b -p 'test*.py'
      - name: Rehearse synthetic internal networks
        run: bash deploy/wallhop-b/rehearsal.sh

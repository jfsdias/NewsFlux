name: Readability presentation prototype
on:
  pull_request:
    paths:
      - 'scripts/research/readability-presentation/**'
      - '.github/workflows/nf-readability-presentation.yml'

permissions:
  contents: read

jobs:
  synthetic-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build research-only lab
        shell: bash
        run: |
          set -euo pipefail
          lab="$(mktemp -d)"
          cp scripts/research/readability-presentation/prototype.mjs "$lab/"
          cat > "$lab/Dockerfile" <<'DOCKERFILE'
          FROM node:22-bookworm
          WORKDIR /lab
          RUN npm install --ignore-scripts --save-exact @mozilla/readability@0.6.0 jsdom@26.1.0
          COPY prototype.mjs ./
          USER node
          DOCKERFILE
          docker build -t nf-readability-presentation "$lab"
          docker image inspect --format '{{.Id}}' nf-readability-presentation
      - name: Execute fixed authored fixtures offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 2 nf-readability-presentation sh -ec '
            node --version
            npm ls --all
            sha256sum package-lock.json prototype.mjs
            node prototype.mjs
          '

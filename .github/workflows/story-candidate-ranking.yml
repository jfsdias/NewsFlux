name: Story Candidate Ranking

on:
  pull_request:
    branches: [main]
    paths:
      - "src/utils/story-candidate-*.js"
      - "src/apis/storyCandidates.js"
      - "src/apis/storyCandidates.test.js"
      - "src/store/storyCandidateState.js"
      - "src/components/Home/HomeEditorial.jsx"
      - "services/story_ranker/**"
      - "Caddyfile"
      - ".github/workflows/story-candidate-ranking.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend story-ranking tests
        run: >-
          node --test
          src/utils/story-candidate-request.test.js
          src/utils/story-candidate-generation.test.js
          src/apis/storyCandidates.test.js

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run stateless engine unit tests
        run: python -m unittest discover -s services/story_ranker/tests -p "test_*.py" -v

name: Article Intelligence fallback unit tests
on:
  pull_request:
    paths:
      - "services/article_intel_summary/**"
      - ".github/workflows/article-intel-fallback-tests.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-volume-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test ownership and crash recovery across containers
        run: bash services/article_intel_summary/tests/ownership_containers.sh
  fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies
        run: python -m pip install -r services/article_intel_summary/requirements.lock
      - name: Run full synthetic backend unit suite
        run: python -m unittest discover -s services/article_intel_summary/tests -p 'test_*.py'

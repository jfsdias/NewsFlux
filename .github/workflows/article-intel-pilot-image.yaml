name: Article Intelligence pilot image
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify isolated Summary image
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          docker build -f services/article_intel_summary/Dockerfile --build-arg SOURCE_COMMIT="$sha" -t newsflux-summary-ci:"$sha" .
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' newsflux-summary-ci:"$sha")" = "$sha"
          test "$(docker image inspect -f '{{.Config.User}}' newsflux-summary-ci:"$sha")" = '10001:10001'
          cid="$(docker run -d --network none -e NEWSFLUX_AI_MINIFLUX_BASE_URL=https://miniflux.example -e NEWSFLUX_AI_ALLOWED_WEB_ORIGINS=https://newsflux.example newsflux-summary-ci:"$sha")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 75); do
            state="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"
            if [ "$state" = healthy ]; then break; fi
            if [ "$state" = unhealthy ] || [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != true ]; then exit 1; fi
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy
          test "$(docker inspect -f '{{len .HostConfig.PortBindings}}' "$cid")" = 0
  synthetic-reader:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install synthetic harness dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm install --frozen-lockfile
          python -m pip install -r services/article_intel_summary/requirements.lock
          node src/scripts/version-info.js
      - name: Run on-demand synthetic Reader scenarios
        env:
          VITE_ARTICLE_INTELLIGENCE_ENABLED: "1"
        run: pnpm exec playwright test --config scripts/pilot-e2e/playwright.config.js

  compose-pilot:
    name: Exact-source Docker Compose pilot gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      ACTIONS_MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || 'NOT_APPLICABLE' }}
    steps:
      - name: Checkout Actions merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate

      - name: Checkout exact base for rollback image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: previous

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify main, HEAD and synthetic merge identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git -C previous rev-parse HEAD)" = "$PR_BASE_SHA"
          candidate_tree="$(git -C candidate rev-parse 'HEAD^{tree}')"
          mkdir -p "$RUNNER_TEMP/newsflux-pilot"
          if [[ "$ACTIONS_MERGE_SHA" != NOT_APPLICABLE ]]; then
            test "$(git rev-parse HEAD)" = "$ACTIONS_MERGE_SHA"
            merge_tree="$(git rev-parse 'HEAD^{tree}')"
            test "$candidate_tree" = "$merge_tree"
            live_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$live_main" = "$PR_BASE_SHA"
          else
            merge_tree=NOT_APPLICABLE
          fi
          {
            echo "PR_HEAD_SHA=$PR_HEAD_SHA"
            echo "PR_BASE_SHA=$PR_BASE_SHA"
            echo "ACTIONS_MERGE_SHA=$ACTIONS_MERGE_SHA"
            echo "CANDIDATE_TREE=$candidate_tree"
            echo "MERGE_TREE=$merge_tree"
            echo "MAIN_HEAD_IDENTITY=PASS"
            echo "SYNTHETIC_MERGE_TREE_IDENTITY=PASS"
          } >> "$RUNNER_TEMP/newsflux-pilot/identity.txt"

      - name: Install candidate Reader dependencies and build component fixture
        working-directory: candidate
        env:
          VITE_ARTICLE_INTELLIGENCE_ENABLED: "1"
          PILOT_HARNESS_BUILD_DIR: ${{ runner.temp }}/newsflux-pilot/reader-harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/newsflux-pilot"
          pnpm install --frozen-lockfile
          node src/scripts/version-info.js
          VITE_BASE_PATH=/pilot-test/ pnpm exec vite build \
            --config scripts/pilot-e2e/vite-compose.config.js \
            --outDir "$PILOT_HARNESS_BUILD_DIR" --emptyOutDir

      - name: Create isolated synthetic credentials, ledger and HTTPS identity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/newsflux-pilot"
          mkdir -m 700 -p "$root/certs" "$root/ledger" "$root/artifacts"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$root/certs/ca.key" -out "$root/certs/ca.crt" \
            -subj '/CN=NewsFlux isolated pilot test CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$root/certs/newsflux.key" -out "$root/certs/newsflux.csr" \
            -subj '/CN=newsflux.example'
          cat > "$root/certs/newsflux.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:newsflux.example
          EOF
          openssl x509 -req -in "$root/certs/newsflux.csr" \
            -CA "$root/certs/ca.crt" -CAkey "$root/certs/ca.key" \
            -CAcreateserial -out "$root/certs/newsflux.crt" -days 1 -sha256 \
            -extfile "$root/certs/newsflux.ext"
          chmod 600 "$root/certs/ca.key" "$root/certs/newsflux.key"
          printf '%s\n' 'synthetic-virtual-key' > "$root/litellm-virtual-key"
          chmod 600 "$root/litellm-virtual-key"
          sudo chown 10001:10001 "$root/litellm-virtual-key" "$root/ledger"
          sudo chmod 700 "$root/ledger"
          cat > "$root/private.env" <<'EOF'
          NEWSFLUX_AI_MINIFLUX_BASE_URL=https://miniflux.example
          NEWSFLUX_AI_ALLOWED_WEB_ORIGINS=https://newsflux.example
          NEWSFLUX_AI_INFERENCE_ENABLED=true
          NEWSFLUX_AI_ALLOW_EXTERNAL_ARTICLE_TRANSFER=true
          NEWSFLUX_AI_ALLOW_PAID_INFERENCE=true
          NEWSFLUX_AI_LITELLM_BASE_URL=https://litellm.example
          NEWSFLUX_AI_LITELLM_MODEL_CHOICE=mistral-small
          NEWSFLUX_AI_LITELLM_S5_FREE_ALIAS=synthetic-s5-free
          NEWSFLUX_AI_LITELLM_MISTRAL_SMALL_ALIAS=newsflux-mistral-small
          NEWSFLUX_AI_LITELLM_S5_FREE_INPUT_USD_PER_MILLION=0
          NEWSFLUX_AI_LITELLM_S5_FREE_OUTPUT_USD_PER_MILLION=0
          NEWSFLUX_AI_LITELLM_MISTRAL_SMALL_INPUT_USD_PER_MILLION=0.15
          NEWSFLUX_AI_LITELLM_MISTRAL_SMALL_OUTPUT_USD_PER_MILLION=0.60
          NEWSFLUX_AI_MONTHLY_BUDGET_USD=1.00
          NEWSFLUX_AI_MAX_INPUT_TOKENS=4096
          NEWSFLUX_AI_MAX_OUTPUT_TOKENS=512
          NEWSFLUX_AI_MAX_REQUESTS_PER_MINUTE=20
          NEWSFLUX_AI_MAX_TOKENS_PER_MINUTE=20000
          NEWSFLUX_AI_INFERENCE_TIMEOUT_SECONDS=15
          EOF
          chmod 600 "$root/private.env"

      - name: Build exact HEAD and previous Reader and Summary images
        shell: bash
        run: |
          set -euo pipefail
          head_date="$(git -C candidate show -s --format=%cI HEAD)"
          docker build -f candidate/Dockerfile \
            --build-arg SOURCE_COMMIT="$PR_HEAD_SHA" \
            --build-arg SOURCE_COMMIT_DATE="$head_date" \
            --build-arg VITE_ARTICLE_INTELLIGENCE_ENABLED=1 \
            -t "newsflux-reader-pilot:$PR_HEAD_SHA" candidate
          docker build -f candidate/services/article_intel_summary/Dockerfile \
            --build-arg SOURCE_COMMIT="$PR_HEAD_SHA" \
            -t "newsflux-summary-pilot:$PR_HEAD_SHA" candidate
          base_date="$(git -C previous show -s --format=%cI HEAD)"
          docker build -f previous/Dockerfile \
            --build-arg SOURCE_COMMIT="$PR_BASE_SHA" \
            --build-arg SOURCE_COMMIT_DATE="$base_date" \
            --build-arg VITE_ARTICLE_INTELLIGENCE_ENABLED=0 \
            -t "newsflux-reader-previous:$PR_BASE_SHA" previous

          reader_tag="newsflux-reader-pilot:$PR_HEAD_SHA"
          summary_tag="newsflux-summary-pilot:$PR_HEAD_SHA"
          previous_tag="newsflux-reader-previous:$PR_BASE_SHA"
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$reader_tag")" = "$PR_HEAD_SHA"
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$summary_tag")" = "$PR_HEAD_SHA"
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$previous_tag")" = "$PR_BASE_SHA"
          test "$(docker image inspect -f '{{.Config.User}}' "$summary_tag")" = '10001:10001'
          reader_id="$(docker image inspect -f '{{.Id}}' "$reader_tag")"
          summary_id="$(docker image inspect -f '{{.Id}}' "$summary_tag")"
          previous_id="$(docker image inspect -f '{{.Id}}' "$previous_tag")"
          previous_caddyfile_sha="$(shasum -a 256 previous/Caddyfile | awk '{print $1}')"
          {
            echo "CANDIDATE_READER_IMAGE_ID=$reader_id"
            echo "CANDIDATE_READER_REVISION=$PR_HEAD_SHA"
            echo "CANDIDATE_SUMMARY_IMAGE_ID=$summary_id"
            echo "CANDIDATE_SUMMARY_REVISION=$PR_HEAD_SHA"
            echo "PREVIOUS_READER_IMAGE_ID=$previous_id"
            echo "PREVIOUS_READER_REVISION=$PR_BASE_SHA"
            echo "PREVIOUS_CADDYFILE_SHA256=$previous_caddyfile_sha"
          } >> "$RUNNER_TEMP/newsflux-pilot/identity.txt"
          echo "IMAGE_IDENTITY_GATE=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"

          project="newsflux-pilot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat >> "$GITHUB_ENV" <<EOF
          PILOT_PROJECT_NAME=$project
          PILOT_HARNESS_DIR=$RUNNER_TEMP/newsflux-pilot/reader-harness
          PILOT_TEST_SOURCE_DIR=$GITHUB_WORKSPACE/candidate/scripts/pilot-e2e
          PILOT_SOURCE_CHECKOUT=$GITHUB_WORKSPACE/candidate
          PILOT_TEST_CERTS_DIR=$RUNNER_TEMP/newsflux-pilot/certs
          PILOT_PLAYWRIGHT_OUTPUT_DIR=$RUNNER_TEMP/newsflux-pilot/artifacts
          PILOT_TEST_INGRESS_CADDYFILE=$GITHUB_WORKSPACE/candidate/scripts/pilot-e2e/Caddyfile.compose-test
          PILOT_TEST_CADDY_IMAGE=caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
          PILOT_PLAYWRIGHT_IMAGE=mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          NEWSFLUX_PILOT_FRONTEND_NETWORK=$project-frontend
          NEWSFLUX_PILOT_GATEWAY_NETWORK=$project-gateway
          NEWSFLUX_PILOT_PRIVATE_SUBNET=172.31.253.0/24
          NEWSFLUX_PILOT_CADDY_IP=172.31.253.2
          NEWSFLUX_PILOT_TRUSTED_PROXY_IP=172.31.252.2
          NEWSFLUX_PILOT_WEB_IMAGE=$reader_tag
          NEWSFLUX_PILOT_SUMMARY_IMAGE=$summary_tag
          NEWSFLUX_PILOT_PRIVATE_ENV_FILE=$RUNNER_TEMP/newsflux-pilot/private.env
          NEWSFLUX_PILOT_KEY_FILE=$RUNNER_TEMP/newsflux-pilot/litellm-virtual-key
          NEWSFLUX_PILOT_LEDGER_DIR=$RUNNER_TEMP/newsflux-pilot/ledger
          NEWSFLUX_PILOT_PREVIOUS_WEB_IMAGE=$previous_tag
          EOF

      - name: Validate and start exact Compose pilot stack
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pilot-e2e/test_compose_gates.py
          compose=(docker compose -p "$PILOT_PROJECT_NAME" \
            -f deploy/article-intel-pilot/compose.yaml \
            -f scripts/pilot-e2e/compose.ci.yaml)
          "${compose[@]}" config --format json > "$RUNNER_TEMP/newsflux-pilot/compose.json"
          python scripts/pilot-e2e/verify-compose.py "$RUNNER_TEMP/newsflux-pilot/compose.json"
          "${compose[@]}" up --detach --pull never

          reader_id="$("${compose[@]}" ps -q pilot-reader)"
          summary_id="$("${compose[@]}" ps -q summary-api)"
          ingress_id="$("${compose[@]}" ps -q pilot-test-ingress)"
          for container_id in "$reader_id" "$summary_id" "$ingress_id"; do
            bindings="$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$container_id")"
            test "$bindings" = null || test "$bindings" = '{}' || test "$bindings" = '[]'
          done

          expected_caddy_sha="$(shasum -a 256 deploy/article-intel-pilot/Caddyfile | awk '{print $1}')"
          actual_caddy_sha="$("${compose[@]}" exec -T pilot-reader sha256sum /etc/caddy/Caddyfile | awk '{print $1}')"
          test "$actual_caddy_sha" = "$expected_caddy_sha"
          "${compose[@]}" exec -T pilot-reader caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          for attempt in $(seq 1 60); do
            reader_health="$(docker inspect -f '{{.State.Health.Status}}' "$reader_id")"
            summary_health="$(docker inspect -f '{{.State.Health.Status}}' "$summary_id")"
            if [[ "$reader_health" = healthy && "$summary_health" = healthy ]]; then break; fi
            if [[ "$reader_health" = unhealthy || "$summary_health" = unhealthy ]]; then exit 1; fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' "$reader_id")" = healthy
          test "$(docker inspect -f '{{.State.Health.Status}}' "$summary_id")" = healthy
          echo "PILOT_COMPOSE_STACK=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"
          echo "CADDY_SUMMARY_HTTP_GATE=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"
          echo "NO_HOST_PORTS=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"

      - name: Verify test TLS identity and run Compose browser scenarios
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -p "$PILOT_PROJECT_NAME" \
            -f deploy/article-intel-pilot/compose.yaml \
            -f scripts/pilot-e2e/compose.ci.yaml)
          "${compose[@]}" --profile pilot-test run --rm --no-deps pilot-e2e \
            node /workspace/scripts/pilot-e2e/check-compose-tls.mjs
          "${compose[@]}" --profile pilot-test run --rm pilot-e2e
          echo "PROXY_TRUST_GATE=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"
          echo "SYNTHETIC_INFERENCE_GATE=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"
          echo "NO_AUTOMATIC_INFERENCE_GATE=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"
          echo "AUTHORIZATION_GATE=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"

      - name: Verify ledger survives Summary API restart
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -p "$PILOT_PROJECT_NAME" \
            -f deploy/article-intel-pilot/compose.yaml \
            -f scripts/pilot-e2e/compose.ci.yaml)
          before="$("${compose[@]}" exec -T summary-api python \
            /app/scripts/pilot-e2e/verify-ledger.py /data/usage.sqlite3)"
          "${compose[@]}" restart summary-api
          summary_id="$("${compose[@]}" ps -q summary-api)"
          for attempt in $(seq 1 60); do
            health="$(docker inspect -f '{{.State.Health.Status}}' "$summary_id")"
            if [[ "$health" = healthy ]]; then break; fi
            if [[ "$health" = unhealthy ]]; then exit 1; fi
            sleep 2
          done
          after="$("${compose[@]}" exec -T summary-api python \
            /app/scripts/pilot-e2e/verify-ledger.py /data/usage.sqlite3)"
          test "$before" = "$after"
          echo "LEDGER_PERSISTENCE_GATE=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"

      - name: Restore exact previous image and configuration
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_compose=(docker compose -p "$PILOT_PROJECT_NAME" \
            -f deploy/article-intel-pilot/compose.yaml \
            -f scripts/pilot-e2e/compose.ci.yaml)
          candidate_id="$("${candidate_compose[@]}" ps -q pilot-reader)"
          test "$(docker inspect -f '{{.Image}}' "$candidate_id")" = \
            "$(docker image inspect -f '{{.Id}}' "$NEWSFLUX_PILOT_WEB_IMAGE")"

          rollback=(docker compose -p "$PILOT_PROJECT_NAME" \
            -f scripts/pilot-e2e/rollback-compose.yaml)
          "${rollback[@]}" up --detach --force-recreate --remove-orphans
          previous_id="$("${rollback[@]}" ps -q pilot-reader)"
          test "$(docker inspect -f '{{.Image}}' "$previous_id")" = \
            "$(docker image inspect -f '{{.Id}}' "$NEWSFLUX_PILOT_PREVIOUS_WEB_IMAGE")"
          expected_config="$(shasum -a 256 ../previous/Caddyfile | awk '{print $1}')"
          restored_config="$(docker exec "$previous_id" sha256sum /etc/caddy/Caddyfile | awk '{print $1}')"
          test "$restored_config" = "$expected_config"
          docker exec "$previous_id" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "ISOLATED_ROLLBACK_GATE=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"
          restored_image_id="$(docker inspect -f '{{.Image}}' "$previous_id")"
          echo "RESTORED_PREVIOUS_IMAGE_ID=$restored_image_id" >> "$RUNNER_TEMP/newsflux-pilot/identity.txt"
          echo "RESTORED_CADDYFILE_SHA256=$restored_config" >> "$RUNNER_TEMP/newsflux-pilot/identity.txt"
          echo "FULL_COMPOSE_GATE=PASS" >> "$RUNNER_TEMP/newsflux-pilot/gates.txt"

      - name: Collect isolated Compose logs and tear down test project
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set +e
          if [[ -n "${PILOT_PROJECT_NAME:-}" ]]; then
            docker compose -p "$PILOT_PROJECT_NAME" \
              -f deploy/article-intel-pilot/compose.yaml \
              -f scripts/pilot-e2e/compose.ci.yaml logs --no-color \
              > "$RUNNER_TEMP/newsflux-pilot/compose.log" 2>&1
            docker compose -p "$PILOT_PROJECT_NAME" \
              -f deploy/article-intel-pilot/compose.yaml \
              -f scripts/pilot-e2e/compose.ci.yaml down --remove-orphans \
              > /dev/null 2>&1
          fi

      - name: Upload exact identities, gate receipt and browser traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: newsflux-pilot-compose-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/newsflux-pilot/identity.txt
            ${{ runner.temp }}/newsflux-pilot/gates.txt
            ${{ runner.temp }}/newsflux-pilot/compose.log
            ${{ runner.temp }}/newsflux-pilot/artifacts/
          if-no-files-found: ignore

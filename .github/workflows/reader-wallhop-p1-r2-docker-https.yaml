name: Reader WallHop P1-R2 Docker HTTPS integration

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact NewsFlux source SHA to validate
        required: true
        type: string
      expected_base_sha:
        description: Expected current main SHA for exact-source provenance
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reader-wallhop-p1-r2-docker-https.yaml"
      - "scripts/reader-wallhop-p1-r2/**"
      - "src/components/Article/**"
      - "src/hooks/useReaderContentRecovery*"
      - "src/apis/content-fallback-reader*"
      - "src/utils/content-fallback-reader*"
      - "src/locales/**"
      - "services/content_fallback/**"
      - "e2e/reader-content-recovery.spec.js"
      - "e2e/support/**"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: reader-wallhop-p1-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  isolated-docker-https:
    name: Exact-SHA images and same-origin HTTPS
    # Docker-in-Docker access is required by this harness; pin the hosted OS generation.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout dedicated harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact NewsFlux source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jfsdias/NewsFlux
          ref: ${{ inputs.source_sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact base and tested candidate
        env:
          NEWSFLUX_EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.expected_base_sha || github.sha }}
          NEWSFLUX_CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          actual="$(git ls-remote https://github.com/jfsdias/NewsFlux.git refs/heads/main | cut -f1)"
          test "$actual" = "$NEWSFLUX_EXPECTED_BASE_SHA"
          test "$(git -C source rev-parse HEAD)" = "$NEWSFLUX_CANDIDATE_SHA"
          git -C source merge-base --is-ancestor "$NEWSFLUX_EXPECTED_BASE_SHA" "$NEWSFLUX_CANDIDATE_SHA"
          test -z "$(git -C source status --porcelain)"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Validate exact-SHA provenance rules
        run: python3 -m unittest discover -s scripts/reader-wallhop-p1-r2 -p 'test_*.py'

      - name: Install locked browser dependencies
        working-directory: source
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node -e 'const p = require("@playwright/test/package.json"); if (p.version !== "1.63.0") process.exit(1); console.log(`PLAYWRIGHT_PACKAGE=${p.version}`)'
          pnpm exec playwright install chromium
          browser="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          test -x "$browser"
          ldd "$browser" | tee "$RUNNER_TEMP/chromium-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/chromium-ldd.txt"; then
            echo "CHROMIUM_DEPENDENCIES=FAIL"
            exit 1
          fi
          echo "CHROMIUM_DEPENDENCIES=PASS"

      - name: Build and validate exact-SHA Docker HTTPS path
        env:
          NEWSFLUX_SOURCE_ROOT: ${{ github.workspace }}/source
          NEWSFLUX_OUTPUT_ROOT: ${{ github.workspace }}/test-results/reader-wallhop-p1-r2
          NEWSFLUX_EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.expected_base_sha || github.sha }}
          NEWSFLUX_CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/reader-wallhop-p1-r2/run.py

      - name: Upload isolated receipts and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-wallhop-p1-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/reader-wallhop-p1-r2/
          if-no-files-found: warn
          retention-days: 7

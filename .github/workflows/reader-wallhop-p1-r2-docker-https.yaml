name: Reader WallHop P1-R2 Docker HTTPS integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reader-wallhop-p1-r2-docker-https.yaml"
      - "scripts/reader-wallhop-p1-r2/**"

permissions:
  contents: read

concurrency:
  group: reader-wallhop-p1-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  isolated-docker-https:
    name: Exact-SHA images and same-origin HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout dedicated harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact NewsFlux source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jfsdias/NewsFlux
          ref: 70f0d0c3c90b19c2853be63039fc7022b301266b
          path: source
          persist-credentials: false

      - name: Verify live main remains the approved exact SHA
        run: |
          actual="$(git ls-remote https://github.com/jfsdias/NewsFlux.git refs/heads/main | cut -f1)"
          test "$actual" = "70f0d0c3c90b19c2853be63039fc7022b301266b"
          test "$(git -C source rev-parse HEAD)" = "$actual"
          test -z "$(git -C source status --porcelain)"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install locked browser dependencies
        working-directory: source
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium

      - name: Add an isolated Chromium CA store tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools

      - name: Build and validate exact-SHA Docker HTTPS path
        env:
          NEWSFLUX_SOURCE_ROOT: ${{ github.workspace }}/source
          NEWSFLUX_OUTPUT_ROOT: ${{ github.workspace }}/test-results/reader-wallhop-p1-r2
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/reader-wallhop-p1-r2/run.py

      - name: Upload isolated receipts and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-wallhop-p1-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/reader-wallhop-p1-r2/
          if-no-files-found: warn
          retention-days: 7

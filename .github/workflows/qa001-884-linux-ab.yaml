name: QA-001-884 Linux A/B diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qa001-884-linux-ab.yaml
      - scripts/qa001-884-diagnostic/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa001-884-linux-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: QA-001-884 ${{ matrix.candidate }} (20 + 20 observations)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - candidate: main
            source_sha: 1fdfd08dd20167373a11a8d113faf237e1716eea
          - candidate: pr212
            source_sha: 90d307f3838b95151a3af0e92fa66452625287b7

    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: control
          persist-credentials: false

      - name: Checkout exact source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Verify source identity and install pinned dependencies
        working-directory: source
        env:
          EXPECTED_SOURCE_SHA: ${{ matrix.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        working-directory: source
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the exact source candidate
        working-directory: source
        run: pnpm build

      - name: Run 20 baseline and 20 instrumented observations
        env:
          CANDIDATE_NAME: ${{ matrix.candidate }}
          CONTROL_DIR: ${{ github.workspace }}/control
          SOURCE_DIR: ${{ github.workspace }}/source
          SOURCE_SHA: ${{ matrix.source_sha }}
        run: node control/scripts/qa001-884-diagnostic/run.mjs

      - name: Upload per-run logs, reports, provenance, traces and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa001-884-${{ matrix.candidate }}-${{ github.run_id }}
          path: control/diagnostic-output/${{ matrix.candidate }}/
          if-no-files-found: error
          retention-days: 14

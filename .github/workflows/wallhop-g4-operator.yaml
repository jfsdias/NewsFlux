name: WallHop G4 operator-only dark canary safety
on:
  pull_request:
    paths:
      - "deploy/wallhop-isolated/g4-dark-canary.sh"
      - "deploy/wallhop-isolated/test_g4_operator.py"
      - "deploy/wallhop-isolated/test_g4_ipam_gate.py"
      - "deploy/wallhop-isolated/g4_ipam_gate.py"
      - ".github/workflows/wallhop-g4-operator.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Offline fail-closed operator admission tests
        run: |
          set -euo pipefail
          python -m unittest discover -s deploy/wallhop-isolated -p "test_g4_operator.py" -v
          python -m unittest discover -s deploy/wallhop-isolated -p "test_g4_ipam_gate.py" -v
          bash -n deploy/wallhop-isolated/g4-dark-canary.sh

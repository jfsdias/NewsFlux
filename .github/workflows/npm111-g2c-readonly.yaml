name: NPM111 G2C read-only static audit tests
on:
  pull_request:
    paths:
      - "ops/deploy/npm111-g2c/**"
      - ".github/workflows/npm111-g2c-readonly.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run offline-only parser regression suite
        run: |
          python -m unittest discover -s ops/deploy/npm111-g2c -p "test_*.py" -v
          python -m py_compile ops/deploy/npm111-g2c/audit.py

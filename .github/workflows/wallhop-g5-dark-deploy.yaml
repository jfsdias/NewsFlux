name: WallHop G5 exact-SHA dark deployment admission
on:
  pull_request:
    paths:
      - "deploy/wallhop-isolated/g5-dark-deploy.sh"
      - "deploy/wallhop-isolated/test_g5_dark_deploy.py"
      - "deploy/wallhop-isolated/G5_DEPLOY.md"
      - ".github/workflows/wallhop-g5-dark-deploy.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g5-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: G5 offline negative admission and syntax
        run: |
          set -euo pipefail
          bash -n deploy/wallhop-isolated/g5-dark-deploy.sh
          python -m unittest discover -s deploy/wallhop-isolated -p "test_g5_dark_deploy.py" -v
      - name: Preserve baseline G4 and isolated topology tests
        run: |
          set -euo pipefail
          python -m unittest discover -s deploy/wallhop-isolated -p "test_g4_operator.py" -v
          python -m unittest discover -s deploy/wallhop-isolated -p "test_g4_ipam_gate.py" -v
          python -m unittest discover -s deploy/wallhop-isolated -p "test_topology.py" -v

# WallHop controlled egress relay (TLS passthrough, SNI allowlist).
# The content-fallback sidecar has no other route out: it sits only on internal networks.
# The sidecar pins every allowlisted host to this relay and validates TLS for the ORIGINAL
# hostname end-to-end, so a DNS change pointing an allowlisted name at an internal service
# cannot be used for SSRF: that service would have to present a valid certificate for it.
global
    log stdout format raw local0 notice
    maxconn 64

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver embedded 127.0.0.11:53
    accepted_payload_size 1232
    resolve_retries 2
    hold valid 30s

frontend egress_tls
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content reject unless { req.ssl_hello_type 1 }
    acl to_wallhop req.ssl_sni -m str -i wallhop.io
    acl to_miniflux req.ssl_sni -m str -i "${MINIFLUX_PUBLIC_HOST}"
    # No SNI, IP-literal SNI, any other name: closed before any upstream connection.
    tcp-request content reject unless to_wallhop or to_miniflux
    use_backend wallhop if to_wallhop
    use_backend miniflux if to_miniflux

backend wallhop
    server wallhop "${WALLHOP_UPSTREAM}" resolvers docker resolve-prefer ipv4 init-addr none

backend miniflux
    # NPM terminates TLS for the public Miniflux host; Miniflux itself is not modified.
    server npm "${MINIFLUX_UPSTREAM}" resolvers docker resolve-prefer ipv4 init-addr none
